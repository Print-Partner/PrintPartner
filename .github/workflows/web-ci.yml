name: Web CI

on:
  workflow_call:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Audit public release inputs
        run: node scripts/audit-public-release.mjs

  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ui: ${{ steps.ui.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select replacement UI inputs
        id: ui
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-path-filter.py ui

  ui:
    name: ui
    needs: [changes]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.ui != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Require successful input selection
        working-directory: .
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTOR_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v24.21.0"
      - name: Lint, test and build the replacement UI
        run: |
          npm ci
          npm run lint --workspace @print-partner/ui
          npm test -w @print-partner/rust-client
          npm run test --workspace @print-partner/ui
          npm run build --workspace @print-partner/ui

  ci-pins:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify pinned Node version
        run: test "$(node --version)" = "v22.23.3"
      - name: Install dependencies without lifecycle scripts
        working-directory: web
        run: npm ci --ignore-scripts
      - name: Check workflow pins and desktop workflow state
        env:
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node web/scripts/check-ci-tool-pins.mjs --event-sha "$EVENT_SHA"
          node web/scripts/check-desktop-workflow-state.mjs
          node --test web/scripts/check-ci-tool-pins.test.mjs web/scripts/check-ci-event-tree.test.mjs web/scripts/check-desktop-workflow-state.test.mjs
          node web/scripts/check-ci-tool-pins.mjs
