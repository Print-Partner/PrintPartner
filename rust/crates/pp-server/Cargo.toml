[package]
name = "pp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["desktop_rebuild"]
desktop_rebuild = ["pp-core/desktop_rebuild"]

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
pp-core = { path = "../pp-core", default-features = false }
# `mcp-stdio`: an MCP server on stdio forwarding to the core's HTTP MCP.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client", "transport-io", "transport-streamable-http-client-reqwest", "reqwest"] }
reqwest = { version = "=0.13.5", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
pp-testkit = { path = "../pp-testkit" }
tempfile = "=3.27.0"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
