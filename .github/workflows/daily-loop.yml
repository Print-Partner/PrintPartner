name: Daily loop

# The twelve steps of docs/product/daily-loop.md, driven in a browser against the
# Rust-only image built from Dockerfile.rust at the commit under test. The score is
# the number of steps that pass with no expected-fail marker. It runs on each push
# to main, on manual dispatch, and on a ready pull request that carries the label
# ci:daily-loop. It is not a required check and does not run in merge groups
# (docs/development/ci.md#daily-loop).
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

# Every push to main gets its own run and its own score. A new push, label or
# draft change on a pull request cancels that pull request's older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  daily-loop:
    name: daily loop
    # On a pull request: only when it is ready for review and carries the label.
    if: >-
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:daily-loop'))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request tests and names its head commit, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      - name: Install the test runner
        run: npm --prefix web ci --ignore-scripts
      - name: Build the image and run the twelve steps
        run: npm --prefix web run test:daily-loop
      - name: Upload the score
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-loop-score
          path: web/test-results/daily-loop/daily-loop-score.json
          if-no-files-found: warn
          retention-days: 90
