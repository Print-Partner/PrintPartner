id: desktop-rebuild-module
language: Rust
severity: warning
message: Keep desktop_rebuild gates on modules or items; shrink statement gates.
files:
  - crates/**/*.rs
utils:
  gate:
    all:
      - any:
          - kind: attribute_item
          - kind: inner_attribute_item
      - has:
          kind: attribute
          has:
            kind: identifier
            regex: '^cfg$'
      - has:
          any:
            - kind: string_literal
              regex: '^"desktop_rebuild"$'
            - kind: raw_string_literal
              regex: '^r#*"desktop_rebuild"#*$'
          stopBy: end
  module:
    any:
      - all:
          - kind: inner_attribute_item
          - inside:
              any:
                - kind: source_file
                - all:
                    - kind: declaration_list
                    - inside:
                        kind: mod_item
      - all:
          - kind: attribute_item
          - precedes:
              any:
                - kind: mod_item
                - kind: use_declaration
              stopBy:
                not:
                  any:
                    - kind: attribute_item
                    - kind: line_comment
                    - kind: block_comment
  item:
    all:
      - kind: attribute_item
      - any:
          - inside:
              kind: ordered_field_declaration_list
          - precedes:
              any:
                - kind: function_item
                - kind: function_signature_item
                - kind: struct_item
                - kind: enum_item
                - kind: union_item
                - kind: type_item
                - kind: const_item
                - kind: static_item
                - kind: trait_item
                - kind: impl_item
                - kind: foreign_mod_item
                - kind: macro_definition
                - kind: enum_variant
                - kind: field_declaration
                - kind: associated_type
              stopBy:
                not:
                  any:
                    - kind: attribute_item
                    - kind: line_comment
                    - kind: block_comment
rule:
  all:
      - matches: gate
      - matches: module
