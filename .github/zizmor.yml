rules:
  dangerous-triggers:
    ignore:
      # Linear sync runs trusted base/default-branch tooling for closed PRs.
      - linear-pr-sync.yml:4
      # Posts pp/score from already-recorded comments. Checks out the default
      # branch only, trusts only scorer_authors, and never runs PR head code.
      - post-pp-score-status.yml:8
  self-repository:
    ignore:
      # actionlint 1.7.12 rejects the replacement $/ syntax. These local workflows
      # resolve at the same commit as the caller without a mutable external ref.
      - release.yml:20
      - release.yml:23
      # The apt package cache action (GRE-1229) is a local composite action that runs at the
      # same commit as its caller; it holds no secrets and saves its cache only on main.
      - desktop-e2e.yml:29
      - desktop-webkit.yml:30
      - rust-cross-os.yml:172
