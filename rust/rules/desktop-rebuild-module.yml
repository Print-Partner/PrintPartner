id: desktop-rebuild-module
language: Rust
severity: warning
message: Keep desktop_rebuild gates on modules or items; shrink statement gates.
files:
  - crates/**/*.rs
utils:
  gate:
    all:
      - any:
          - kind: attribute_item
          - kind: inner_attribute_item
      - has:
          kind: attribute
          has:
            kind: identifier
            regex: '^(r#)?cfg(_attr)?$'
      - has:
          any:
            - kind: string_literal
              # Escaped literals are candidates; the checker decodes the value.
              regex: '(?s)^"(desktop_rebuild|.*\\.*)"$'
            - kind: raw_string_literal
              regex: '^r#*"desktop_rebuild"#*$'
          stopBy: end
  module:
    any:
      - all:
          - kind: inner_attribute_item
          - inside:
              any:
                - kind: source_file
                - all:
                    - kind: declaration_list
                    - inside:
                        kind: mod_item
      - all:
          - kind: attribute_item
          - precedes:
              any:
                - kind: mod_item
                - kind: use_declaration
              stopBy:
                not:
                  any:
                    - kind: attribute_item
                    - kind: line_comment
                    - kind: block_comment
  item:
    any:
      - all:
          - kind: inner_attribute_item
          - inside:
              all:
                - kind: declaration_list
                - inside:
                    any:
                      - kind: impl_item
                      - kind: trait_item
                      - kind: foreign_mod_item
      - all:
          - kind: attribute_item
          - any:
              - inside:
                  kind: ordered_field_declaration_list
              - precedes:
                  any:
                    - kind: function_item
                    - kind: function_signature_item
                    - kind: struct_item
                    - kind: enum_item
                    - kind: union_item
                    - kind: type_item
                    - kind: const_item
                    - kind: static_item
                    - kind: trait_item
                    - kind: impl_item
                    - kind: foreign_mod_item
                    - kind: macro_definition
                    - kind: enum_variant
                    - kind: field_declaration
                    - kind: associated_type
                    - kind: extern_crate_declaration
                  stopBy:
                    not:
                      any:
                        - kind: attribute_item
                        - kind: line_comment
                        - kind: block_comment
              - all:
                  - inside:
                      any:
                        - kind: source_file
                        - kind: declaration_list
                  - precedes:
                      any:
                        - kind: macro_invocation
                        - all:
                            - kind: expression_statement
                            - has:
                                kind: macro_invocation
                      stopBy:
                        not:
                          any:
                            - kind: attribute_item
                            - kind: line_comment
                            - kind: block_comment
rule:
  all:
      - matches: gate
      - matches: module
