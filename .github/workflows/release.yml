name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  quality:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/web-ci.yml

  manifests:
    uses: ./.github/workflows/validate-manifests.yml

  release:
    needs: [quality, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/print-partner/print-partner
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      commit: ${{ steps.identity.outputs.commit }}
      version: ${{ steps.identity.outputs.version }}
      build_date: ${{ steps.identity.outputs.build_date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate tagged commit
        id: identity
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_object="$(git rev-parse "refs/tags/${TAG}")"
          commit="$(git rev-parse "refs/tags/${TAG}^{}")"
          head_commit="$(git rev-parse 'HEAD^{commit}')"
          test "$commit" = "$head_commit"
          version="${TAG#v}"
          build_date="$(git show -s --format=%cI "$commit")"
          node scripts/release.mjs check --tag "$TAG" --commit "$commit"
          {
            echo "tag=$TAG"
            echo "tag_object=$tag_object"
            echo "commit=$commit"
            echo "version=$version"
            echo "build_date=$build_date"
            echo "candidate_tag=commit-$commit"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Check for an existing candidate image
        id: candidate
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push candidate image
        if: steps.candidate.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PP_APP_VERSION=${{ steps.identity.outputs.version }}
            PP_COMMIT=${{ steps.identity.outputs.commit }}
            PP_TAG=${{ steps.identity.outputs.tag }}
            PP_BUILD_DATE=${{ steps.identity.outputs.build_date }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.identity.outputs.candidate_tag }}
          annotations: |
            index:org.opencontainers.image.source=https://github.com/Print-Partner/PrintPartner
            index:org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            index:org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
            index:org.opencontainers.image.ref.name=${{ steps.identity.outputs.tag }}
            manifest-descriptor:org.opencontainers.image.source=https://github.com/Print-Partner/PrintPartner
            manifest-descriptor:org.opencontainers.image.version=${{ steps.identity.outputs.version }}
            manifest-descriptor:org.opencontainers.image.revision=${{ steps.identity.outputs.commit }}
            manifest-descriptor:org.opencontainers.image.ref.name=${{ steps.identity.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve and verify candidate digest
        id: image
        env:
          CANDIDATE_TAG: ${{ steps.identity.outputs.candidate_tag }}
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.identity.outputs.commit }}
          EXPECTED_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          reference="$IMAGE:$CANDIDATE_TAG"
          digest="$(docker buildx imagetools inspect "$reference" | awk '/^Digest:/ { print $2; exit }')"
          test -n "$digest"
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > candidate-manifest.json
          jq -e \
            --arg version "$EXPECTED_VERSION" \
            --arg commit "$EXPECTED_COMMIT" \
            --arg tag "$EXPECTED_TAG" \
            '.annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $commit and
             .annotations["org.opencontainers.image.ref.name"] == $tag and
             ([.manifests[] | select(
               .platform.os == "linux" and
               (.platform.architecture == "amd64" or .platform.architecture == "arm64")
             )] | length) == 2 and
             all(.manifests[] | select(
               .platform.os == "linux" and
               (.platform.architecture == "amd64" or .platform.architecture == "arm64")
             );
               .annotations["org.opencontainers.image.version"] == $version and
               .annotations["org.opencontainers.image.revision"] == $commit and
               .annotations["org.opencontainers.image.ref.name"] == $tag)' \
            candidate-manifest.json
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Render release identity asset
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/release.mjs render-asset \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --digest "$DIGEST" \
            --output release-identity.json

      - name: Sign release identity asset
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY --new-bundle-format \
            --bundle release-identity.json.sigstore.json release-identity.json

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          COMMIT: ${{ steps.identity.outputs.commit }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json tagName --jq .tagName)" = "$TAG"
            mkdir -p existing-release
            assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for asset in release-identity.json cosign.pub; do
              if grep -Fxq "$asset" <<< "$assets"; then
                gh release download "$TAG" --pattern "$asset" --dir existing-release
                cmp --silent "$asset" "existing-release/$asset"
              else
                gh release upload "$TAG" "$asset"
              fi
            done
            # Every signing run writes a new bundle, so keep a published bundle that still verifies.
            bundle=release-identity.json.sigstore.json
            if grep -Fxq "$bundle" <<< "$assets"; then
              gh release download "$TAG" --pattern "$bundle" --dir existing-release
              cosign verify-blob --key cosign.pub --bundle "existing-release/$bundle" release-identity.json
              cp "existing-release/$bundle" "$bundle"
            else
              gh release upload "$TAG" "$bundle"
            fi
          else
            gh release create "$TAG" release-identity.json release-identity.json.sigstore.json cosign.pub \
              --verify-tag \
              --target "$COMMIT" \
              --title "Print Partner $TAG" \
              --generate-notes
          fi

      - name: Create or verify immutable version alias
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            existing="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')"
            test "$existing" = "$DIGEST"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          verified="$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')"
          test "$verified" = "$DIGEST"

      - name: Verify public release identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json tagName,isDraft --jq 'select(.isDraft == false) | .tagName')" = "$TAG"
          test "$(jq -r .image.digest release-identity.json)" = "$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')" = "$DIGEST"

      - name: Verify signatures
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          cosign verify --key cosign.pub "$IMAGE@$DIGEST" >/dev/null
          cosign verify-blob --key cosign.pub --bundle release-identity.json.sigstore.json release-identity.json

      - name: Advance latest convenience alias
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.identity.outputs.tag }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          latest_release="$(gh release view --json tagName --jq .tagName)"
          if [ "$latest_release" = "$TAG" ]; then
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          else
            echo "Skipping latest: GitHub currently marks $latest_release as the latest release."
          fi

  # The Rust-only image (Dockerfile.rust, GRE-1295). It follows the release
  # policy above: amd64 and arm64, OCI annotations, signed by digest with the
  # release key, and an immutable version alias. It adds SBOM and provenance
  # attestations. Each architecture builds, passes the smoke test and is pushed
  # from its own native runner, because a multi-arch manifest alone does not
  # prove an image runs. It never moves `latest`.
  rust-image:
    name: rust image release (${{ matrix.arch }})
    needs: release
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/print-partner/pp-server
      ARCH: ${{ matrix.arch }}
      COMMIT: ${{ needs.release.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out the release commit
        run: test "$(git rev-parse 'HEAD^{commit}')" = "$COMMIT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The architecture tag is written only after the smoke test and the
      # layer check pass, so an existing tag means a verified image.
      - name: Check for an existing architecture candidate
        id: candidate
        run: |
          set -euo pipefail
          state="$(scripts/registry-tag-state.sh "$IMAGE:commit-$COMMIT-$ARCH")"
          echo "exists=$([ "$state" = present ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # No GitHub Actions cache: a release builds from the tagged sources only.
      - name: Build the image for the smoke test
        if: steps.candidate.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.rust
          platforms: linux/${{ matrix.arch }}
          tags: pp-server:release
          load: true
          push: false
          build-args: |
            PP_APP_VERSION=${{ needs.release.outputs.version }}
            PP_COMMIT=${{ needs.release.outputs.commit }}
            PP_BUILD_DATE=${{ needs.release.outputs.build_date }}

      - name: Smoke-test the image on this architecture
        if: steps.candidate.outputs.exists == 'false'
        run: |
          set -euo pipefail
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' pp-server:release)" = "linux/$ARCH"
          python3 scripts/docker-rust-smoke.py pp-server:release

      # Same inputs on the same builder, so every layer comes from the build
      # above. Pushed by digest, with no tag, until the next step proves it.
      - name: Push the architecture image by digest with SBOM and provenance
        id: push
        if: steps.candidate.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.rust
          platforms: linux/${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          build-args: |
            PP_APP_VERSION=${{ needs.release.outputs.version }}
            PP_COMMIT=${{ needs.release.outputs.commit }}
            PP_BUILD_DATE=${{ needs.release.outputs.build_date }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Tag the architecture candidate once it matches the smoke-tested image
        if: steps.candidate.outputs.exists == 'false'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          pushed="$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{json .Image}}' | jq -c .rootfs.diff_ids)"
          tested="$(docker image inspect --format '{{json .RootFS.Layers}}' pp-server:release | jq -c .)"
          test "$pushed" = "$tested"
          docker buildx imagetools create --tag "$IMAGE:commit-$COMMIT-$ARCH" "$IMAGE@$DIGEST"
          test "$(docker buildx imagetools inspect "$IMAGE:commit-$COMMIT-$ARCH" | awk '/^Digest:/ { print $2; exit }')" = "$DIGEST"

  rust-image-publish:
    name: rust image release (publish)
    needs: [release, rust-image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/print-partner/pp-server
      TAG: ${{ needs.release.outputs.tag }}
      COMMIT: ${{ needs.release.outputs.commit }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v2.6.1

      - name: Create or reuse the multi-arch candidate
        run: |
          set -euo pipefail
          candidate="$IMAGE:commit-$COMMIT"
          state="$(scripts/registry-tag-state.sh "$candidate")"
          if [ "$state" = absent ]; then
            docker buildx imagetools create --tag "$candidate" \
              --annotation "index:org.opencontainers.image.source=https://github.com/Print-Partner/PrintPartner" \
              --annotation "index:org.opencontainers.image.version=$VERSION" \
              --annotation "index:org.opencontainers.image.revision=$COMMIT" \
              --annotation "index:org.opencontainers.image.ref.name=$TAG" \
              "$IMAGE:commit-$COMMIT-amd64" "$IMAGE:commit-$COMMIT-arm64"
          fi

      - name: Verify the candidate, its SBOM and its provenance
        id: image
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:commit-$COMMIT" | awk '/^Digest:/ { print $2; exit }')"
          test -n "$digest"
          docker buildx imagetools inspect "$IMAGE@$digest" --raw > rust-candidate-manifest.json
          # One image per architecture, and one attestation manifest for each.
          jq -e \
            --arg version "$VERSION" \
            --arg commit "$COMMIT" \
            --arg tag "$TAG" \
            '.annotations["org.opencontainers.image.version"] == $version and
             .annotations["org.opencontainers.image.revision"] == $commit and
             .annotations["org.opencontainers.image.ref.name"] == $tag and
             ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort) == ["amd64", "arm64"] and
             ([.manifests[] | select(.platform.os == "linux") | .digest] | sort) ==
             ([.manifests[] | select(.annotations["vnd.docker.reference.type"] == "attestation-manifest")
               | .annotations["vnd.docker.reference.digest"]] | sort)' \
            rust-candidate-manifest.json
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE@$digest" --format "{{json (index .SBOM \"linux/$arch\")}}" \
              | jq -e '.SPDX.spdxVersion | startswith("SPDX-")'
            docker buildx imagetools inspect "$IMAGE@$digest" --format "{{json (index .Provenance \"linux/$arch\")}}" \
              | jq -e '.SLSA.buildDefinition.externalParameters.request.args["build-arg:PP_COMMIT"] == env.COMMIT'
          done
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Sign image
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$IMAGE@$DIGEST"

      - name: Create or verify immutable version alias
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # A registry error fails here; only a confirmed absence creates the alias.
          state="$(scripts/registry-tag-state.sh "$IMAGE:$VERSION")"
          if [ "$state" = absent ]; then
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          test "$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ { print $2; exit }')" = "$DIGEST"

      - name: Verify signature
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign verify --key cosign.pub "$IMAGE@$DIGEST" >/dev/null
