[package]
name = "pp-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
# Keep JSON object keys in insertion order. The shipped binaries already get
# this through pp-core -> pp-storage; declaring it here keeps /__runtime and
# other bodies in the same order when pp-gateway builds on its own.
serde_json = { workspace = true, features = ["preserve_order"] }
rand.workspace = true
sha2.workspace = true
hex.workspace = true
tokio-util = { workspace = true, features = ["io"] }
http-body.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pp-compat = { path = "../pp-compat" }
pp-net = { path = "../pp-net" }
pp-os = { path = "../pp-os" }
http-body-util.workspace = true
pp-drivers = { path = "../pp-drivers" }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
pp-testkit = { path = "../pp-testkit" }
tokio = { workspace = true, features = ["test-util"] }
tempfile = "=3.27.0"
