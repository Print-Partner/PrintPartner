# lane-rules.yaml: retired as a self-driving intake.
# Lanes no longer pick, claim, score, merge, or close out tickets on their own. The coordinator-run
# plan replaces that loop: Notion "Print Partner: execution plan v17.1 (council-agreed)". The repository
# rules are in docs/development/definition-of-done.md (merge gate, scorer seats, Fixes-only close-out)
# and docs/development/agent-workflow.md (safety guard, coordinator worktree).
# Removed here: the picker (next-ticket.py and its inputs), the Linear claim, merge_gate, close_out,
# end_of_wake, author_overflow, wake.scorer_deadline, the scorer seat rules and scorer_policy.
# .github/workflows/lane-dispatch.yml is disabled until the owner re-approves it. Restoring any removed
# block needs an owner-approved PR; git history keeps the old version.
version: 3
updated: "2026-11-03T00:00:00-05:00"

source:
  team: {key: GRE, name: Personal, id: 5f575c20-8e60-499a-9b9f-eb0da5fd0011}
  project: "Print Partner Desktop (Rust core)"
  repo: Print-Partner/PrintPartner

caps:
  tickets_per_pr: 1
  max_pr_lines: 1500             # about 1,500; Mission PRs about 600
  one_writer_per_crate: true

never: [merging from a lane worktree, force-push, --admin, --auto, ruleset changes, branch-protection changes,
        repo-settings changes, YNAB, "Chad's real plans", cloud agents, printing or asking for secrets]
