[package]
name = "pp-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = { version = "=0.7.1", default-features = false }

[dev-dependencies]
proptest = "=1.12.0"
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
