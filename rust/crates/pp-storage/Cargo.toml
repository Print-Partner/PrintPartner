[package]
name = "pp-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop_rebuild = ["serde_json/raw_value", "dep:serde_path_to_error", "dep:pp-domain", "pp-domain/desktop_rebuild", "dep:saphyr-parser", "dep:pp-contracts", "pp-contracts/desktop_rebuild", "dep:png"]
# Weak features: codegen adds schemas without activating the gated edges.
codegen = ["dep:schemars", "pp-contracts?/codegen", "pp-domain?/codegen"]
# Test-only. Lets tests open unmarked directories with the Rust writer in a
# desktop_rebuild build. Enabled only from [dev-dependencies]; check-boundaries.py
# refuses any other activation, so release builds never contain it.
test-unmarked-writer = []

[[bin]]
name = "required-unit-fixture"
required-features = ["desktop_rebuild"]

[dependencies]
pp-contracts = { path = "../pp-contracts", optional = true }
pp-domain = { path = "../pp-domain", optional = true }
pp-os = { path = "../pp-os" }
anyhow.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
serde_path_to_error = { workspace = true, optional = true }
fs2.workspace = true
fs4.workspace = true
libc.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
flate2 = "=1.1.10"
tar = { version = "=0.4.46", default-features = false }
time = { version = "=0.3.55", features = ["std", "parsing"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "password-hash"] }
scrypt = { version = "=0.11.0", default-features = false }
base64 = "=0.22.1"
subtle = { version = "=2.6.1", default-features = false }
hmac.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "=2.5.8"
getrandom = "=0.3.4"
icu_collator = "=2.3.1"
regress = "=0.11.1"
ryu-js = "=1.0.2"
saphyr-parser = { version = "=0.1.0", default-features = false, optional = true }
schemars = { version = "=0.8.22", optional = true }
png = { version = "=0.18.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
pp-storage = { path = ".", features = ["test-unmarked-writer"] }
pp-testkit = { path = "../pp-testkit" }
rusqlite = { workspace = true, features = ["hooks"] }
tempfile = "=3.27.0"
