[package]
name = "pp-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop_rebuild = [
    "pp-storage/desktop_rebuild",
    "dep:http-body",
    "dep:ryu-js",
    "dep:rusqlite",
    "dep:pp-services",
    "dep:rmcp",
    "dep:serde_path_to_error",
]
codegen = ["desktop_rebuild", "dep:schemars", "pp-storage/codegen"]

[[bin]]
name = "export-rust-client"
required-features = ["codegen"]

[dependencies]
pp-storage = { path = "../pp-storage" }
pp-services = { path = "../pp-services", optional = true }
rmcp = { version = "=3.5.0", default-features = false, features = ["server", "transport-streamable-http-server"], optional = true }
anyhow.workspace = true
log = "=0.4.34"
axum.workspace = true
tower = { version = "=0.5.3", default-features = false }
http-body = { version = "=1.0.1", optional = true }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_path_to_error = { workspace = true, optional = true }
sha2.workspace = true
hex.workspace = true
base64 = "=0.22.1"
getrandom = "=0.3.4"
time = { version = "=0.3.55", features = ["std", "parsing"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "stream"] }
ryu-js = { version = "=1.0.2", optional = true }
rusqlite = { workspace = true, optional = true }
schemars = { version = "=0.8.22", optional = true }
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }

[dev-dependencies]
# Test-only opt-in: lets tests open unmarked directories in desktop_rebuild builds.
pp-storage = { path = "../pp-storage", features = ["test-unmarked-writer"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rusqlite.workspace = true
tempfile = "=3.27.0"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
hyper = { workspace = true, features = ["server"] }
hyper-util.workspace = true
