name: Review gate rerun

# Reruns the `review-gate` job for a PR head when the evidence it reads
# changes: a review workflow finished on that head, or the repository owner
# created, edited, or deleted a comment containing a pp-review-gate marker.
# These events run the default branch's copy of this file. The job calls the
# GitHub API only; it never checks out or runs code.
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Droid Auto Review, Claude Review]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (contains(github.event.comment.body, 'pp-review-gate') || contains(github.event.changes.body.from, 'pp-review-gate')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun review-gate for the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.issue.number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = issue_comment ]; then
            head=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          else
            head=$RUN_HEAD_SHA
          fi
          # A running gate cannot be rerun, so wait for it to finish first.
          for _ in $(seq 1 40); do
            run=$(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?event=pull_request&head_sha=$head&per_page=1" \
              --jq '.workflow_runs[0] // empty | "\(.id) \(.status)"')
            if [ -z "$run" ]; then
              echo "No review-gate run exists for $head yet; when it starts it reads the current state."
              exit 0
            fi
            read -r id status <<< "$run"
            if [ "$status" = completed ] && gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null; then
              echo "Reran review-gate run $id for $head."
              exit 0
            fi
            sleep 10
          done
          echo "::error::review-gate run $id for $head did not finish within about 7 minutes; rerun it by hand."
          exit 1
