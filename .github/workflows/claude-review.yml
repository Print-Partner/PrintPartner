name: Claude Review

# Claude code review and Claude security review on every ready PR head, both
# with anthropics/claude-code-action. They authenticate with the owner's Claude
# subscription token, CLAUDE_CODE_OAUTH_TOKEN, and fall back to
# ANTHROPIC_API_KEY when that secret is unset. Both post findings as inline PR
# review comments, so each finding is a thread that the ruleset requires to be
# resolved. `review-gate` accepts a head when `claude-code-review` succeeded on
# it and `claude-security-review` succeeded or was neutral.
# See docs/development/definition-of-done.md#code-review.
#
# The action is not hardened against prompt injection, so the jobs run only for
# PRs from this repository authored by the repository owner. Claude may read
# files and run only `gh pr diff`, `gh pr view` and `gh pr comment`; it never
# builds or runs PR code. The action replaces .claude/, .mcp.json, CLAUDE.md
# and the other files Claude Code reads at startup with the base branch's copies.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-code-review:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require Claude credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set, so Claude cannot review this PR. The owner runs 'claude setup-token' and stores the token as the CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude code review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The API key is passed only when the subscription token is unset.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request for correctness. Read the diff with `gh pr diff`. Read AGENTS.md first: its Rules section lists the project's hard rules, and a violation is a finding.

            Report only real problems: correctness bugs, data loss or corruption, changed SQLite formats or immutable IDs, printer sends without an explicit user action, broken tests, and docs the change makes wrong. A separate job reviews security. Skip style preferences.

            Post each finding as one inline comment on the line it concerns, with mcp__github_inline_comment__create_inline_comment and confirmed: true. Start each comment with a priority: P0 (data loss, crash), P1 (wrong behavior), or P2 (minor). Then post one short top-level comment with `gh pr comment` that starts with "Claude code review" and counts the findings by priority, or says there are none.

            Never approve or request changes. Do not build, test, install, or run anything from the repository.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Glob,Grep"

  claude-security-review:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Require Claude credentials
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set, so Claude cannot review this PR. The owner runs 'claude setup-token' and stores the token as the CLAUDE_CODE_OAUTH_TOKEN repository secret."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run Claude security review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The API key is passed only when the subscription token is unset.
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Do a security review of this pull request. Read the diff with `gh pr diff`, and read the surrounding code where you need context. Read AGENTS.md first: a change that breaks one of its Rules is a finding.

            Look for vulnerabilities the change introduces:
            - injection: shell, SQL, path or URL built from input, template or HTML injection;
            - authentication and admission: routes or MCP tools reachable without auth, loopback treated as trusted, sharing turned on by default, pairing or session checks that can be skipped;
            - secrets: tokens, cookies, pairing secrets, or API keys written to logs, errors, responses, screenshots, or committed files;
            - path traversal and unsafe file operations: paths from input escaping their root, symlink following, non-atomic writes of user data, deletes outside the app's own files;
            - printer sends without an explicit user action, and retries of an uncertain send;
            - CI changes that grant extra permissions, run PR code with secrets, or use unpinned actions.

            Report only issues with a concrete exploit or failure path. Skip denial of service, rate limiting, and generic hardening advice.

            Post each finding as one inline comment on the line it concerns, with mcp__github_inline_comment__create_inline_comment and confirmed: true. Start each comment with a severity: HIGH, MEDIUM, or LOW, then the exploit path and the fix. Then post one short top-level comment with `gh pr comment` that starts with "Claude security review" and counts the findings by severity, or says there are none.

            Never approve or request changes. Do not build, test, install, or run anything from the repository.
          claude_args: >-
            --model claude-opus-5-5
            --max-turns 60
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Glob,Grep"
