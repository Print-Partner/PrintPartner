[package]
name = "pp-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Disposable Print Partner installations for tests. Only a dev-dependency."

[dependencies]
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile = "=3.27.0"
tokio.workspace = true
rustls = { version = "=0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
