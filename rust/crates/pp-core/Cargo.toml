[package]
name = "pp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
desktop_rebuild = ["pp-compat/desktop_rebuild", "pp-storage/desktop_rebuild", "dep:ryu-js", "dep:regress", "dep:pp-source", "pp-source/desktop_rebuild", "dep:reqwest", "dep:pp-net", "dep:pp-api", "pp-api/desktop_rebuild", "dep:axum"]

[dependencies]
pp-storage = { path = "../pp-storage" }
pp-perf = { path = "../pp-perf" }
pp-os = { path = "../pp-os" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
fs2.workspace = true
libc.workspace = true
tokio-util.workspace = true
tracing.workspace = true
pp-compat = { path = "../pp-compat" }
pp-gateway = { path = "../pp-gateway" }
ryu-js = { version = "=1.0.2", optional = true }
regress = { version = "=0.11.1", optional = true }

pp-api = { path = "../pp-api", optional = true }
axum = { workspace = true, optional = true }
pp-net = { path = "../pp-net", optional = true }
pp-source = { path = "../pp-source", optional = true }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream"], optional = true }

[dev-dependencies]
# Test-only opt-in: lets tests open unmarked directories in desktop_rebuild builds.
pp-storage = { path = "../pp-storage", features = ["test-unmarked-writer"] }
pp-testkit = { path = "../pp-testkit" }
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
socket2 = "=0.6.5"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
