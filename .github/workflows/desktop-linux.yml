name: Desktop Linux

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.select.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed desktop inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-path-filter.py desktop-linux

  desktop-linux:
    name: desktop (linux)
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - name: Require successful input selection
        if: needs.changes.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        uses: ./.github/actions/linux-gui-deps
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev pkg-config mold
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustc --version
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.148
      - name: Generate the compile-only manifest
        run: |
          manifest="$RUNNER_TEMP/desktop-compile-manifest.json"
          python3 rust/scripts/build-desktop-manifest.py --compile-only --output "$manifest"
          echo "PP_DESKTOP_RELEASE_MANIFEST=$manifest" >> "$GITHUB_ENV"
      - name: Build the Rust desktop binary
        run: cargo build --locked --manifest-path rust/Cargo.toml -p pp-desktop --features desktop_rebuild
      - name: Run the Rust desktop tests
        run: cargo nextest run --locked --manifest-path rust/Cargo.toml -p pp-desktop --features desktop_rebuild --profile desktop-linux --no-tests=fail
