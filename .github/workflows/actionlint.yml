name: Actionlint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main, master]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  agent-guidance:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate shared agent guidance
        run: |
          python3 -B -m unittest discover -s scripts -p test_agent_guidance.py -v
          python3 -B scripts/check-agent-guidance.py
          python3 -B -m unittest discover -s scripts -p test_agent_guard.py -v
          python3 -B -m unittest discover -s scripts -p test_pre_commit_sparse_snapshot.py -v

  large-files:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tracked file sizes
        run: |
          python3 -B -m unittest discover -s scripts -p test_check_large_files.py -v
          python3 -B scripts/check-large-files.py

  python-lint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Ruff
        run: |
          python3 -m venv "$RUNNER_TEMP/ruff"
          "$RUNNER_TEMP/ruff/bin/pip" install -r requirements-dev.txt
          echo "$RUNNER_TEMP/ruff/bin" >> "$GITHUB_PATH"
      - name: Lint Python with Ruff
        run: |
          python3 -B -m unittest discover -s scripts -p test_ruff_lint.py -v
          python3 -B -m unittest discover -s scripts -p test_operation_inventory.py -v
          ruff check scripts rust/scripts web/scripts slicer-sidecar .claude/hooks

  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.select.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -B -m unittest discover -s scripts -p test_merge_group_workflows.py
          python3 -B -m unittest discover -s scripts -p test_cancel_stale_merge_groups.py
          python3 -B -m unittest discover -s scripts -p test_review_gate.py
          python3 -B -m unittest discover -s scripts -p 'test_*path_filter.py'
          python3 -B -m unittest discover -s scripts -p test_alert_macos_main.py
          python3 -B -m unittest discover -s scripts -p test_devcontainer.py -v
          python3 scripts/ci-path-filter.py actions

  actionlint:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful input selection
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTOR_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Run actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

  zizmor:
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful input selection
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTOR_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor 1.31.1
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          min-severity: informational
          advanced-security: false
          annotations: true
          config: .github/zizmor.yml
