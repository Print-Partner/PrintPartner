id: desktop-rebuild-statement
valid:
  - "#[cfg(feature = \"other\")] fn f() {}"
  - "const S: &str = \"#[cfg(feature = \\\"desktop_rebuild\\\")]\";"
  - "#[doc = \"desktop_rebuild\"] fn f() {}"
  - "#[cfg(feature = \"desktop_rebuild\")] mod m;"
  - "#[cfg(not(feature = \"desktop_rebuild\"))] #[allow(unused)] /* gap */ use crate::m;"
  - "#[cfg(feature = \"desktop_rebuild\")] fn f() {}"
  - "fn f() { #[cfg(feature = \"desktop_rebuild\")] struct S; }"
  - "struct S { #[cfg(feature = \"desktop_rebuild\")] x: u8 }"
  - "enum E { #[cfg(feature = \"desktop_rebuild\")] A }"
  - "struct S(#[cfg(feature = \"desktop_rebuild\")] u8);"
  - "#![cfg(feature = \"desktop_rebuild\")] fn f() {}"
  - "mod m { #![cfg(feature = \"desktop_rebuild\")] fn f() {} }"
  - "#[cfg_attr(all(feature = \"codegen\", feature = \"desktop_rebuild\"), derive(Clone))] struct S;"
  - "struct S { #[cfg_attr(feature = \"desktop_rebuild\", serde(default))] x: u8 }"
  - "#[r#cfg(feature = \"desktop_rebuild\")] fn f() {}"
  - "fn f() { #[cfg_attr(feature = \"desktop_rebuild\", allow(unused))] struct S; }"
  - "fn f() { #[cfg(feature = \"desktop_rebuild\")] use crate::m; }"
  - "#![cfg_attr(not(test), cfg(feature = \"desktop_rebuild\"))] fn f() {}"
  - "#[cfg_attr(test, doc = \"desktop_rebuild\")] struct S;"
  - "#[cfg(feature=\"other\\x5ffeature\")] struct S;"
  - "#[cfg_attr(all(), cfg_attr(test, doc=\"desktop_rebuild\"))] struct S;"
invalid:
  - "fn f() { #[cfg(feature = \"desktop_rebuild\")] let x = 1; }"
  - "fn f() { #[cfg(any(feature = \"desktop_rebuild\", test))] #[allow(unused)] work(); }"
  - "fn f() { match x { #[cfg(feature = \"desktop_rebuild\")] A => (), _ => () } }"
  - "fn f() { let x = S { #[cfg(feature = \"desktop_rebuild\")] x: 1 }; }"
  - "fn f() { #[cfg(feature = r\"desktop_rebuild\")] let x = 1; }"
  - "fn f() { #[cfg /* comment */ (feature = \"desktop_rebuild\")] let x = 1; }"
  - "fn f() { # [cfg(feature = \"desktop_rebuild\")] let x = 1; }"
  - "fn f() { #![cfg(feature = \"desktop_rebuild\")] let x=1; }"
  - "fn f() { #[cfg_attr(all(feature = \"desktop_rebuild\", unix), allow(unused))] let x = 1; }"
  - "fn f() { #[cfg(feature=\"desktop\\x5frebuild\")] let x=1; }"
  - "fn f() { #[cfg(feature=\"desktop\\u{5f}rebuild\")] let x=1; }"
  - "#[cfg(feature=\"desktop_rebuild\")] extern crate foo;"
  - "#[cfg(feature=\"desktop_rebuild\")] node_case!(x);"
  - "mod m { #[cfg(feature=\"desktop_rebuild\")] node_case! { x } }"
  - "trait T { #[cfg(feature=\"desktop_rebuild\")] methods!(); }"
  - "impl S { #![cfg(feature=\"desktop_rebuild\")] fn f() {} }"
  - "trait T { #![cfg(feature=\"desktop_rebuild\")] fn f(); }"
  - "fn f() { #[cfg(feature=\"desktop_rebuild\")] node_case!(x); }"
  - "fn f() { #[cfg_attr(all(), cfg(feature = \"desktop_rebuild\"))] let x = 1; }"
  - "fn f() { #[cfg_attr(not(any()), cfg_attr(feature = \"desktop_rebuild\", cfg(all())))] let y = 2; }"
  - "extern \"C\" { #![cfg(feature=\"desktop_rebuild\")] fn f(); }"
