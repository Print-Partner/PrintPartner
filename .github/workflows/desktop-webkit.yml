name: Desktop WebKitGTK WebGL smoke

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, converted_to_draft]
    paths:
      - 'rust/**'
      - 'rust-toolchain.toml'
      - 'web/apps/**'
      - 'web/packages/**'
      - 'web/package*.json'
      - 'web/tsconfig.base.json'
      - 'web/scripts/atomic-package-build.mjs'
      - 'scripts/setup-ci-linux.sh'
      - '.github/workflows/desktop-webkit.yml'
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) && 'push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.run_attempt == '1' && !startsWith(github.ref, 'refs/tags/')) }}

jobs:
  webkit-stl:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:desktop-smoke'))
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '3'
      VITE_PRINT_PARTNER_DESKTOP: '1'
      # Mesa llvmpipe supplies real WebGL without a GPU.
      LIBGL_ALWAYS_SOFTWARE: '1'
      WEBKIT_DISABLE_DMABUF_RENDERER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK, WebDriver, Mesa and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config \
            webkit2gtk-driver xvfb xauth dbus-x11 libgl1-mesa-dri libegl1 mesa-utils
      - name: Verify diagnostic capture in real WebKit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/webkit-proof"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' \
            python3 rust/tests/test_webkit_diagnostics.py -v 2>&1 \
            | tee "$RUNNER_TEMP/webkit-proof/diagnostics-tests.log"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify Node runtime
        run: test "$(node --version)" = "v24.21.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build and stage the production desktop assets
        run: |
          npm --prefix web ci
          npm --prefix web run build
          python3 rust/scripts/stage-desktop.py --web web --node "$(command -v node)" \
            --output "$RUNNER_TEMP/webkit-stage" --commit "$GITHUB_SHA"
      - name: Build pp-desktop
        env:
          PP_DESKTOP_RELEASE_MANIFEST: ${{ runner.temp }}/webkit-stage/bundle-manifest.json
        run: cargo build --locked --manifest-path rust/Cargo.toml -p pp-desktop
      - name: Launch native desktop and prove the STL viewer renders
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/webkit-proof"
          dbus-run-session -- xvfb-run -a glxinfo -B > "$RUNNER_TEMP/webkit-proof/runner-glxinfo.txt" 2>&1 || true
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x1024x24' \
            python3 rust/tests/webkit_stl_smoke.py --stage "$RUNNER_TEMP/webkit-stage" \
            --output "$RUNNER_TEMP/webkit-proof" 2>&1 | tee "$RUNNER_TEMP/webkit-proof/verify.log"
          cat "$RUNNER_TEMP/webkit-proof/receipt.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native screenshot and WebGL proof
        if: always()
        id: proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-webkit-stl-proof
          path: ${{ runner.temp }}/webkit-proof/
          if-no-files-found: error
      - name: Link proof artifact
        if: always() && steps.proof.outputs.artifact-url != ''
        env:
          ARTIFACT_URL: ${{ steps.proof.outputs.artifact-url }}
        run: echo "Screenshot and WebGL receipt $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
