name: Review gate rerun

# Reruns the `review-gate` job for a PR head when the evidence it reads
# changes: a review workflow finished on that head, or the repository owner
# created, edited, or deleted a comment containing a pp-review-gate marker.
# These events run the default branch's copy of this file. The job calls the
# GitHub API only; it never checks out or runs code. A fork workflow named like
# a review workflow can trigger it, but a rerun only repeats the base branch's
# gate, which checks where each result came from, so it cannot create a pass.
on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [Droid Auto Review, Claude Review]
    types: [completed]

permissions: {}

jobs:
  rerun:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == 'poitee' &&
      (contains(github.event.comment.body, 'pp-review-gate') || contains(github.event.changes.body.from, 'pp-review-gate')))
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.workflow_run.head_sha }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Rerun review-gate for the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # The job's concurrency group is per PR for comments and per head for review runs, so a newer
          # event for the same target replaces an older one that would do the same work.
          if [ "$EVENT_NAME" = issue_comment ]; then
            pr=$ISSUE_NUMBER
          else
            pr=${RUN_PR_NUMBER:-$(gh api "repos/$REPO/commits/$RUN_HEAD_SHA/pulls" --jq '[.[] | select(.state == "open")][0].number // empty')}
          fi
          if [ -z "$pr" ]; then
            echo "No open pull request has $RUN_HEAD_SHA as a commit; nothing to rerun."
            exit 0
          fi
          head=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
          if [ "$EVENT_NAME" = workflow_run ] && [ "$head" != "$RUN_HEAD_SHA" ]; then
            echo "$RUN_HEAD_SHA is no longer the head of #$pr ($head); its review result is obsolete."
            exit 0
          fi
          # A running gate cannot be rerun, so wait for it to finish first.
          for _ in $(seq 1 250); do
            now=$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)
            if [ "$now" != "$head" ]; then
              echo "#$pr moved from $head to $now while waiting; the new head's own gate run judges it."
              exit 0
            fi
            # Only main's gate for this PR: a run for another PR on the same head into another
            # branch ran that branch's copy of the file. Runs are listed newest first. A fork PR's
            # runs list no PR, so they are never picked; rerun those from the Checks tab.
            run=$(gh api "repos/$REPO/actions/workflows/review-gate.yml/runs?event=pull_request_target&head_sha=$head&per_page=100" \
              --jq "[.workflow_runs[] | select(any(.pull_requests[]?; .number == $pr and .base.ref == \"main\"))][0] // empty | \"\\(.id) \\(.status)\"")
            if [ -z "$run" ]; then
              echo "No review-gate run exists for $head yet; when it starts it reads the current state."
              exit 0
            fi
            read -r id status <<< "$run"
            if [ "$status" = completed ] && [ "$(gh api "repos/$REPO/pulls/$pr" --jq .head.sha)" = "$head" ] \
              && gh api -X POST "repos/$REPO/actions/runs/$id/rerun" > /dev/null; then
              echo "Reran review-gate run $id for $head."
              exit 0
            fi
            sleep 10
          done
          echo "::error::review-gate run $id for $head did not finish within about 40 minutes; rerun it by hand."
          exit 1
