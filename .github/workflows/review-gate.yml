name: Review gate

# `review-gate` is the required review check. It runs on pull_request_target,
# so GitHub runs this file and its logic from the base branch, never the PR's
# copy. The job reads the GitHub API only (files, check runs, workflow runs and
# comments). It never checks out or runs PR code, and it gets no secrets.
#
# It passes on a PR head when any of these holds for that exact head SHA:
#   1. the droid-review job of .github/workflows/droid-review.yml succeeded
#      and its log shows droid-action's review step ran (it skips silently);
#   2. the claude-code-review job of .github/workflows/claude-review.yml
#      succeeded and claude-security-review succeeded or was neutral;
#   For 1 and 2 the check suite must come from that workflow path on
#   pull_request, and GitHub must have run the default branch's copy of the
#   file: its blob at the head equals the default branch's blob, or the PR does
#   not change the file (the merge commit then carries the base's copy).
#   3. a comment by the repository owner has a line that is exactly the
#      coordinator marker, with lowercase hex and single spaces:
#      <!-- pp-review-gate head=<40-char sha> reviewer=<model> findings=<n> -->
# It fails, whatever else holds, when a check run named like one of these jobs
# comes from any other workflow file or event, or when GitHub's file list for
# the PR is incomplete (the files API stops at 3000). When a PR author other
# than the owner changes a workflow, .github/zizmor.yml or
# scripts/agent-guard.py, .factory/ or .claude/ (the hook configs that load
# the guard), as Dependabot's action bumps do, it needs both path 3 (the
# owner's marker for that head) and path 1 or 2.
# Every push or edit waits up to 30 minutes for the head's Claude jobs, then fails unless one
# path holds. An edit reruns the gate. review-gate-rerun.yml reruns it on review end.
# A PR into another branch runs that branch's copy of this file; see the note under the trigger.
on:
  pull_request_target:
    # This copy runs only for PRs into main. It fails a PR whose base is not the default branch
    # (a rerun after a retarget) and fails when any review-gate check run on the head lists a PR
    # into another base, whose copy of this file could always pass. GitHub fills a run's
    # pull_requests from the PRs open from its head branch now, not from the PR that started it,
    # so this catches such a PR only while it is open; definition-of-done.md names the remaining
    # risk. .github/zizmor.yml ignores the trigger by line: keep it on line 31.
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require a finished review of the head commit
        if: github.event_name == 'pull_request_target'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: poitee
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import json, os, re, subprocess, sys, time

          REPO, PR, HEAD = os.environ["REPO"], os.environ["PR_NUMBER"], os.environ["HEAD_SHA"]
          AUTHOR, OWNER, DEFAULT = os.environ["AUTHOR"], os.environ["OWNER"], os.environ["DEFAULT_BRANCH"]
          ACTIONS_APP = 15368
          # Workflows, zizmor config, the safety guard, and the hook configs that load it.
          PROTECTED = re.compile(r"^(?:\.github/workflows/|\.github/zizmor\.yml$|scripts/agent-guard\.py$"
                                 r"|\.factory/|\.claude/)")
          # droid-action logs this when its review step ran. It reports job success when it skips the
          # review (for example on a PR that changes droid-review.yml), so the conclusion alone is not enough.
          # Only a whole runner line counts, and the log must hold exactly one such line for the step.
          DROID_STEP = re.compile(r"^\ufeff?(?:\d{4}-\d\d-\d\dT[\d:.]+Z )?##\[end-action "
                                  r"id=__Factory-AI_droid-action\.droid;outcome=(\w+);"
                                  r"conclusion=\w+;duration_ms=\d+\]\r?$", re.M)
          # Each job check the gate reads, and the only workflow file and event that may produce it.
          ORIGINS = {
              "review-gate": (".github/workflows/review-gate.yml", "pull_request_target"),
              "droid-review": (".github/workflows/droid-review.yml", "pull_request"),
              "claude-code-review": (".github/workflows/claude-review.yml", "pull_request"),
              "claude-security-review": (".github/workflows/claude-review.yml", "pull_request"),
          }
          # The exact line the coordinator posts; GitHub stores comment text decoded, so no other form counts.
          MARKER = re.compile(r"^<!-- pp-review-gate head=([0-9a-f]{40}) reviewer=([A-Za-z0-9._:/@+-]+) "
                              r"findings=([0-9]+) -->$", re.M)
          FILES_API_LIMIT = 3000


          def pages(path):
              out = subprocess.run(["gh", "api", "--paginate", "--slurp", path],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)


          def blob(path, ref):
              result = subprocess.run(["gh", "api", f"repos/{REPO}/contents/{path}?ref={ref}"],
                                      capture_output=True, text=True)
              return json.loads(result.stdout).get("sha") if result.returncode == 0 else None


          listed = [item for page in pages(f"repos/{REPO}/pulls/{PR}/files?per_page=100") for item in page]
          # Every path the PR touches: added, changed, removed (status "removed" keeps the old path in
          # filename), and both sides of a rename, so moving a protected file away still counts.
          files = {item["filename"] for item in listed} | {item["previous_filename"] for item in listed
                                                           if item.get("previous_filename")}
          pull = json.loads(subprocess.run(["gh", "api", f"repos/{REPO}/pulls/{PR}"], check=True,
                                           capture_output=True, text=True).stdout)
          changed, pr_base = pull["changed_files"], pull["base"]["ref"]
          # Claude's review starts with this run, so wait for its jobs instead of failing early.
          # Only the Claude jobs are waited on, only for a bounded time, and a job that never
          # appears within GRACE seconds counts as not running. Everything below judges the final
          # state, so waiting decides when the gate judges and cannot create a pass.
          MAX_WAIT = int(os.environ.get("PP_GATE_MAX_WAIT_SECONDS", "1800"))
          GRACE, INTERVAL = min(120, MAX_WAIT), int(os.environ.get("PP_GATE_POLL_SECONDS", "30"))
          CLAUDE_JOBS = tuple(name for name, (path, _) in ORIGINS.items()
                              if path == ".github/workflows/claude-review.yml")
          started_at = time.monotonic()


          def newest(run):
              """Sort key for the latest run of a check: a queued run has no start time yet and is the newest."""
              return run.get("started_at") or "9999"


          def moved():
              """Whether the PR head or base changed since this run read them."""
              current = json.loads(subprocess.run(["gh", "api", f"repos/{REPO}/pulls/{PR}"], check=True,
                                                  capture_output=True, text=True).stdout)
              return current["head"]["sha"] != HEAD or current["base"]["ref"] != pr_base


          while True:
              seen = {}
              for page in pages(f"repos/{REPO}/commits/{HEAD}/check-runs?filter=all&per_page=100"):
                  for item in page["check_runs"]:
                      if item["name"] in CLAUDE_JOBS:
                          if item["name"] not in seen or newest(item) > newest(seen[item["name"]]):
                              seen[item["name"]] = item
              if moved():
                  print(f"::error::The PR head or base moved while waiting for {HEAD}; the run for the "
                        "change judges it.")
                  sys.exit(1)
              waiting = [name for name in CLAUDE_JOBS
                         if name in seen and seen[name]["status"] != "completed"
                         or (name not in seen and time.monotonic() - started_at < GRACE)]
              if not waiting or time.monotonic() - started_at >= MAX_WAIT:
                  break
              print(f"Waiting for {', '.join(waiting)} on {HEAD}.", flush=True)
              time.sleep(INTERVAL)
          runs = [run for page in pages(f"repos/{REPO}/commits/{HEAD}/check-runs?filter=all&per_page=100")
                  for run in page["check_runs"] if run["name"] in ORIGINS]
          comments = [item for page in pages(f"repos/{REPO}/issues/{PR}/comments?per_page=100") for item in page]

          suites = {}


          def workflow_run(run):
              """Return the Actions workflow run behind a check run, or None."""
              if (run.get("app") or {}).get("id") != ACTIONS_APP:
                  return None
              suite = run["check_suite"]["id"]
              if suite not in suites:
                  found = [item for page in pages(f"repos/{REPO}/actions/runs?check_suite_id={suite}")
                           for item in page["workflow_runs"]]
                  suites[suite] = found[0] if found else None
              return suites[suite]


          def origin(run):
              """Return (workflow path, event) of the Actions run that produced a check run, or None."""
              found = workflow_run(run)
              return (found["path"].split("@")[0], found["event"]) if found else None


          def other_bases(found):
              """The bases other than the default branch of the PRs an Actions run lists."""
              return sorted({(item.get("base") or {}).get("ref") or "unknown"
                             for item in (found or {}).get("pull_requests") or []} - {DEFAULT})


          def for_this_pr(name):
              """Whether the latest run of a check came from this PR into the default branch.

              Another PR with the same head SHA but another base runs that base's copy of the workflow,
              so this PR must target the default branch, the run's pull_requests must name this PR, and
              every PR it names must target the default branch. Anything else, including an empty list,
              fails closed.
              """
              found = workflow_run(latest[name]) if name in latest else None
              prs = (found or {}).get("pull_requests") or []
              return (pr_base == DEFAULT and bool(prs) and not other_bases(found)
                      and any(str(item.get("number")) == PR for item in prs))


          problems, latest, touched = [], {}, []
          if pr_base != DEFAULT:
              problems.append(f"The PR targets {pr_base}, not {DEFAULT}; review-gate passes only PRs into {DEFAULT}.")
          if changed >= FILES_API_LIMIT or len(listed) != changed:
              problems.append(f"GitHub listed {len(listed)} of the PR's {changed} changed files (the files API stops "
                              f"at {FILES_API_LIMIT}), so the gate cannot check every path. Split the PR.")
          if AUTHOR != OWNER:
              touched = sorted(name for name in files if PROTECTED.match(name))
          for run in runs:
              name, where = run["name"], origin(run)
              if where != ORIGINS[name]:
                  problems.append(f"check run {name} ({run['id']}) comes from {where or 'another app'}, "
                                  f"not {ORIGINS[name][0]} on {ORIGINS[name][1]}.")
              elif name == "review-gate" and other_bases(workflow_run(run)):
                  # Same file and event, but listed for a PR into another branch, whose copy of the
                  # gate could always pass. Its result must not stand next to this one on the head.
                  problems.append(f"check run review-gate ({run['id']}) lists a PR into "
                                  f"{', '.join(other_bases(workflow_run(run)))}, so it may come from that "
                                  f"branch's copy of the gate. Close that PR or push a new head.")
              elif name not in latest or newest(run) > newest(latest[name]):
                  latest[name] = run


          def state(name):
              run = latest.get(name)
              return "missing" if run is None else run.get("conclusion") or run.get("status")


          marker = None
          for comment in comments:
              if (comment.get("user") or {}).get("login") != OWNER:
                  continue
              body = (comment.get("body") or "").replace("\r\n", "\n")
              for head, reviewer, findings in MARKER.findall(body):
                  if head == HEAD:
                      marker = f"{reviewer}, {findings} findings, {comment.get('html_url')}"

          def droid_reviewed(run):
              """Whether droid-action's review step ran in this job. The Actions job id is the check run id."""
              result = subprocess.run(["gh", "api", "--allow-escape-sequences",
                                       f"repos/{REPO}/actions/jobs/{run['id']}/logs"], capture_output=True, text=True)
              return result.returncode == 0 and DROID_STEP.findall(result.stdout) == ["success"]


          def base_definition(path):
              """Whether GitHub ran the default branch's copy of a workflow file for this head."""
              if path not in files:
                  return True
              head = blob(path, HEAD)
              return head is not None and head == blob(path, DEFAULT)


          droid, code, security = state("droid-review"), state("claude-code-review"), state("claude-security-review")
          droid_ok = (droid == "success" and for_this_pr("droid-review") and base_definition(ORIGINS["droid-review"][0])
                      and droid_reviewed(latest["droid-review"]))
          if droid == "success" and not droid_ok:
              droid = ("success, but the run is not this PR's into main, the Droid review did not run, "
                       "or its workflow differs from main")
          claude_ok = (code == "success" and security in ("success", "neutral")
                       and for_this_pr("claude-code-review") and for_this_pr("claude-security-review")
                       and base_definition(ORIGINS["claude-code-review"][0]))
          if code == "success" and not claude_ok and security in ("success", "neutral"):
              code = "success, but the run is not this PR's into main or its workflow differs from main"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Review gate for `{HEAD}`\n\n| Path | State |\n| --- | --- |\n"
                            f"| droid-review | {droid} |\n| claude-code-review | {code} |\n"
                            f"| claude-security-review | {security} |\n| coordinator marker | {marker or 'none'} |\n")
              for problem in problems:
                  summary.write(f"\n**Blocked:** {problem}\n")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          # A retarget that landed during judgement must not be passed on the old base.
          if moved():
              print(f"::error::The PR head or base moved while judging {HEAD}; the run for the change judges it.")
              sys.exit(1)
          if touched:
              if not (marker and (droid_ok or claude_ok)):
                  print(f"::error::{AUTHOR} is not the repository owner and changes {', '.join(touched)}. "
                        f"This PR needs both the owner's pp-review-gate marker for {HEAD} and a passing Droid "
                        f"or Claude review; marker: {'yes' if marker else 'no'}, automated review: "
                        f"{'yes' if droid_ok or claude_ok else 'no'}.")
                  sys.exit(1)
              print(f"Passed: owner marker for {HEAD} ({marker}) and an automated review cover {AUTHOR}'s "
                    f"changes to {', '.join(touched)}.")
          elif droid_ok:
              print(f"Passed: droid-review succeeded on {HEAD}.")
          elif claude_ok:
              print(f"Passed: claude-code-review succeeded and claude-security-review is {security} on {HEAD}.")
          elif marker:
              print(f"Passed: coordinator marker for {HEAD} ({marker}).")
          else:
              print(f"::error::No finished review of {HEAD}: droid-review is {droid}, claude-code-review is {code}, "
                    f"claude-security-review is {security}, and no coordinator marker names this head. "
                    "A review from a workflow file this PR changes away from the default branch does not count.")
              sys.exit(1)
      # On a merge group this step reports review-gate without judging a review again. It finds
      # the queue entry whose merge commit is the group head, and passes only when every PR at or
      # ahead of that entry targets the default branch and the latest review-gate run for that PR
      # into the default branch succeeded on the PR's current head, from this file on
      # pull_request_target. Any other result, including an entry it cannot find, fails. It reads the API only, checks out
      # nothing and gets no secrets. The job has no `if`: a skipped required job counts as a pass.
      - name: Require a passed review-gate on every pull request in the merge group
        if: github.event_name != 'pull_request_target'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          import json, os, re, subprocess, sys, time

          REPO, EVENT, DEFAULT = os.environ["REPO"], os.environ["EVENT_NAME"], os.environ["DEFAULT_BRANCH"]
          HEAD, HEAD_REF, BASE_REF = (os.environ["GROUP_HEAD_SHA"], os.environ["GROUP_HEAD_REF"],
                                      os.environ["GROUP_BASE_REF"])
          ACTIONS_APP = 15368
          GATE = (".github/workflows/review-gate.yml", "pull_request_target")
          ENTRIES_LIMIT = 100
          QUERY = """query($owner: String!, $name: String!, $branch: String!) {
            repository(owner: $owner, name: $name) { mergeQueue(branch: $branch) {
              entries(first: 100) { totalCount nodes { position headCommit { oid }
                pullRequest { number headRefOid baseRefName } } } } } }"""
          # GitHub may announce the group before the queue lists its entry, so look again for a while.
          # Waiting only decides when the step judges; a missing entry still fails.
          FIND_WAIT = int(os.environ.get("PP_GATE_FIND_WAIT_SECONDS", "120"))
          INTERVAL = int(os.environ.get("PP_GATE_POLL_SECONDS", "15"))


          def fail(message):
              print(f"::error::{message}")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write(f"## Review gate for merge group `{HEAD}`\n\n**Blocked:** {message}\n")
              sys.exit(1)


          def api(*args):
              result = subprocess.run(["gh", "api", *args], capture_output=True, text=True)
              if result.returncode != 0:
                  fail(f"gh api {args[-1]} failed: {result.stderr.strip()[:300]}")
              return json.loads(result.stdout)


          if EVENT != "merge_group":
              fail(f"review-gate does not judge {EVENT or 'unknown'} events.")
          if not re.fullmatch(r"[0-9a-f]{40}", HEAD):
              fail(f"The merge group head {HEAD!r} is not a commit SHA.")
          if BASE_REF != f"refs/heads/{DEFAULT}":
              fail(f"The merge group targets {BASE_REF}, not refs/heads/{DEFAULT}.")
          named = re.fullmatch(rf"refs/heads/gh-readonly-queue/{re.escape(DEFAULT)}/pr-([0-9]+)-[0-9a-f]+", HEAD_REF)
          if not named:
              fail(f"The merge group ref {HEAD_REF} is not a merge queue ref for {DEFAULT}.")
          owner, name = REPO.split("/", 1)
          started_at = time.monotonic()
          while True:
              queue = api("graphql", "-f", f"query={QUERY}", "-f", f"owner={owner}", "-f", f"name={name}",
                          "-f", f"branch={DEFAULT}")["data"]["repository"]["mergeQueue"] or {}
              entries = queue.get("entries") or {"totalCount": 0, "nodes": []}
              if entries["totalCount"] > ENTRIES_LIMIT:
                  fail(f"The queue holds {entries['totalCount']} entries; the gate reads only {ENTRIES_LIMIT}.")
              mine = [entry for entry in entries["nodes"] if (entry.get("headCommit") or {}).get("oid") == HEAD]
              if mine or time.monotonic() - started_at >= FIND_WAIT:
                  break
              print(f"Waiting for the queue to list the entry for {HEAD}.", flush=True)
              time.sleep(INTERVAL)
          if len(mine) != 1:
              fail(f"The merge queue for {DEFAULT} lists {len(mine)} entries for {HEAD}, not one.")
          (entry,) = mine
          if str((entry.get("pullRequest") or {}).get("number")) != named.group(1):
              fail(f"The queue entry for {HEAD} is not PR #{named.group(1)}, which its ref names.")
          # The group's merge commit sits on every entry ahead of it, so all of them are in the group.
          group = sorted((item for item in entries["nodes"] if item["position"] <= entry["position"]),
                         key=lambda item: item["position"])

          problems, passed = [], []
          for item in group:
              pull = item.get("pullRequest") or {}
              number, pr_head = pull.get("number"), pull.get("headRefOid") or ""
              if pull.get("baseRefName") != DEFAULT:
                  problems.append(f"PR #{number} targets {pull.get('baseRefName')}, not {DEFAULT}.")
                  continue
              if not re.fullmatch(r"[0-9a-f]{40}", pr_head):
                  problems.append(f"PR #{number} has no head commit in the queue.")
                  continue
              pages = api("--paginate", "--slurp",
                          f"repos/{REPO}/commits/{pr_head}/check-runs?check_name=review-gate&filter=all&per_page=100")
              runs = [run for page in pages for run in page["check_runs"] if run["name"] == "review-gate"]
              latest, wrong = None, []
              for run in runs:
                  found = None
                  if (run.get("app") or {}).get("id") == ACTIONS_APP:
                      found = (api(f"repos/{REPO}/actions/runs?check_suite_id={run['check_suite']['id']}")
                               .get("workflow_runs") or [None])[0]
                  if not found or (found["path"].split("@")[0], found["event"]) != GATE:
                      wrong.append(str(run["id"]))
                      continue
                  # pull_request_target runs the base branch's copy of this file, so only a run that
                  # GitHub lists for this PR, with every listed PR into the default branch, ran main's
                  # gate. A run for another PR with the same head, maybe into a branch whose copy of the
                  # gate always passes, does not count. Fork PRs list no PR and fail here.
                  prs = found.get("pull_requests") or []
                  if not (any(str(pr.get("number")) == str(number) for pr in prs)
                          and all((pr.get("base") or {}).get("ref") == DEFAULT for pr in prs)):
                      continue
                  if latest is None or (run.get("started_at") or "9999") > (latest.get("started_at") or "9999"):
                      latest = run
              if wrong:
                  problems.append(f"PR #{number} head {pr_head} has review-gate check runs {', '.join(wrong)} "
                                  f"that do not come from {GATE[0]} on {GATE[1]}.")
              elif latest is None or latest.get("conclusion") != "success":
                  state = ("missing for this PR into " + DEFAULT if latest is None
                           else latest.get("conclusion") or latest.get("status"))
                  problems.append(f"review-gate on PR #{number} head {pr_head} is {state}, not success.")
              else:
                  passed.append(f"PR #{number} at {pr_head}")
          if problems:
              fail(" ".join(problems))
          print(f"Passed: review-gate succeeded on the head of {', '.join(passed)} in merge group {HEAD}.")
