name: Rust cross-OS

# Pull requests, pushes to main, and merge groups run Linux fmt, clippy, and
# nextest on the default Rust-only build. The required check stays `rust (linux)`,
# an aggregate over the parts below. On ubuntu-latest, nextest is six hash
# partitions and fmt/clippy are a separate part. On pp-local, one part runs all
# three. The nightly schedule and a manual dispatch build the workspace on
# Windows and macOS and do not run the Linux parts. `rust (windows tests)` runs
# named Windows tests on a pull request that touches their crates, and on a
# manual dispatch. It is not a required check. See docs/development/ci.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.event_name == 'merge_group' && format('queue-{0}', github.event.merge_group.head_sha) || github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == '1' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  INSTA_UPDATE: 'no'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  changes:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.select.outputs.relevant }}
      nextest_filter: ${{ steps.select.outputs.nextest_filter }}
      linux_runs_on: ${{ steps.runner.outputs.linux_runs_on }}
      linux_kind: ${{ steps.runner.outputs.linux_kind }}
      linux_parts: ${{ steps.runner.outputs.linux_parts }}
      windows_tests: ${{ steps.windows_tests.outputs.windows_tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changed inputs
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 -B -m unittest discover -s scripts -p 'test_*path_filter.py'
          python3 -B -m unittest discover -s scripts -p 'test_*affected_nextest_filter.py'
          python3 -B -m unittest discover -s scripts -p test_alert_macos_main.py
          python3 scripts/ci-path-filter.py rust
          python3 scripts/ci-affected-nextest-filter.py
      - name: Select Windows test inputs
        id: windows_tests
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-path-filter.py windows-tests
      - name: Select the Linux Rust runner
        id: runner
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          RUN_ID: ${{ github.run_id }}
          PP_RUST_RUNNER: ${{ vars.PP_RUST_RUNNER }}
          RUNNER_TOKEN: ${{ secrets.PP_RUNNER_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B -m unittest discover -s scripts -p test_ci_rust_runner.py
          python3 scripts/ci-rust-runner.py

  rust-linux-parts:
    name: rust (linux) ${{ matrix.part }}
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && needs.changes.result == 'success' && needs.changes.outputs.relevant != 'false')
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_runs_on || '"ubuntu-latest"') }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # check: fmt and clippy. m/n: nextest hash partition. 1/1: all three.
        part: ${{ fromJSON(needs.changes.outputs.linux_parts || '["1/1"]') }}
    env:
      PP_RUNNER_KIND: ${{ needs.changes.outputs.linux_kind }}
      NEXTEST_FILTER: ${{ needs.changes.outputs.nextest_filter || 'all()' }}
    steps:
      - name: Require successful input selection
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
        run: test "$SELECTOR_RESULT" = success
      - name: Free disk on hosted Linux
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        run: |
          set -euo pipefail
          df -h /
          avail_g=$(df -P -BG / | awk 'NR==2 { gsub(/[^0-9]/, "", $4); print $4 }')
          if [ -z "${avail_g}" ]; then
            echo "could not read free space; deleting preinstalled toolchains"
            avail_g=0
          fi
          # One default-feature tree fits when the image still has 50G free.
          # Deleting the preinstalled SDKs took about two minutes on the GRE-1649 warm run.
          if [ "${avail_g}" -lt 50 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              "${RUNNER_TOOL_CACHE:-/opt/hostedtoolcache}/CodeQL"
            df -h /
          else
            echo "free space ${avail_g}G is at least 50G; leaving preinstalled toolchains"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up self-hosted Linux prerequisites
        if: runner.os == 'Linux' && env.PP_RUNNER_KIND == 'pp-local'
        run: bash "$GITHUB_WORKSPACE/scripts/setup-ci-linux.sh"
      - name: Set up Rust on self-hosted Linux
        if: runner.os == 'Linux' && env.PP_RUNNER_KIND == 'pp-local'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.100.0'
          components: rustfmt, clippy
      - name: Use the pp-local sccache
        if: env.PP_RUNNER_KIND == 'pp-local'
        run: bash "$GITHUB_WORKSPACE/scripts/ci-pp-local-sccache.sh"
      - name: Fetch pinned historical schema commits
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install the pinned toolchain from rust-toolchain.toml
        id: toolchain
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: env.PP_RUNNER_KIND != 'pp-local'
        with:
          # The action otherwise keys on the job id. `rust-linux` is the id
          # that saved the warm cache before this job was split.
          shared-key: rust-linux
          workspaces: rust -> target
          # One part saves. The test parts compile the same binaries; six saves would race.
          save-if: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && matrix.part == '1/6' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        if: matrix.part != 'check'
        with:
          tool: nextest@0.9.148
      - name: cargo fmt
        id: fmt
        if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check
      - name: Install Linux desktop dependencies
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        uses: ./.github/actions/linux-gui-deps
        with:
          packages: libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev pkg-config mold
      - name: Link with mold
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        run: |
          mold --version
          echo 'CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-fuse-ld=mold' >> "$GITHUB_ENV"
      - name: Install pinned storage-fixture Node
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.3'
      - name: Record storage-fixture executable
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        run: |
          test "$(node --version)" = v22.23.3
          echo "PP_SCHEMA_PARITY_NODE=$(node -p process.execPath)" >> "$GITHUB_ENV"
      - name: Install Node for the measured manifest
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        id: assets
        if: ${{ !cancelled() && steps.fmt.outcome == 'success' }}
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
          MANIFEST_PYTHON: python3
        run: |
          set -euo pipefail
          node_path=$(node -p process.execPath)
          if [[ "$RUNNER_OS" == Linux ]]; then
            sudo ln -sf "$node_path" /usr/bin/node
          fi
          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"
          npm --prefix web ci
          npm --prefix web run build
          "$MANIFEST_PYTHON" rust/scripts/build-desktop-manifest.py --web web --node "$node_path" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: clippy
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && (matrix.part == 'check' || matrix.part == '1/1') }}
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets --keep-going -- -D warnings
      - name: nextest
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && matrix.part != 'check' }}
        timeout-minutes: 30
        env:
          NEXTEST_PARTITION: ${{ matrix.part }}
        run: cargo nextest run --manifest-path rust/Cargo.toml --locked --workspace --no-fail-fast --no-tests=warn --partition "hash:${NEXTEST_PARTITION}" -E "$NEXTEST_FILTER"
      - name: Disk after nextest
        if: ${{ !cancelled() && steps.assets.outcome == 'success' && matrix.part != 'check' && runner.environment == 'github-hosted' }}
        run: df -h /
      - name: sccache stats
        if: always() && env.PP_RUNNER_KIND == 'pp-local'
        continue-on-error: true
        run: '"${RUSTC_WRAPPER:-sccache}" --show-stats'

  rust-linux:
    name: rust (linux)
    needs: [changes, rust-linux-parts]
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (always() && !cancelled() && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group') && (needs.changes.result != 'success' || needs.changes.outputs.relevant != 'false'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the Linux parts
        env:
          SELECTOR_RESULT: ${{ needs.changes.result }}
          PARTS_RESULT: ${{ needs.rust-linux-parts.result }}
        run: |
          test "$SELECTOR_RESULT" = success
          test "$PARTS_RESULT" = success

  rust-nightly:
    name: rust (${{ matrix.name }})
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-26
            name: macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned historical schema commits
        run: rust/scripts/fetch-historical-schema-commits.sh
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust -> target
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build desktop assets and generate measured manifest
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
          MANIFEST_PYTHON: python3
        run: |
          set -euo pipefail
          node_path=$(node -p process.execPath)
          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"
          npm --prefix web ci
          npm --prefix web run build
          "$MANIFEST_PYTHON" rust/scripts/build-desktop-manifest.py --web web --node "$node_path" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Build the workspace
        run: cargo build --manifest-path rust/Cargo.toml --locked --workspace

  # Not a required check. Runs the Windows tests named in GRE-1795, GRE-1796
  # and GRE-1799, each in its own nextest call, and writes one result row per
  # call to the job summary. A test that is renamed away fails its call
  # (--no-tests=fail) instead of passing with nothing run.
  rust-windows-tests:
    name: rust (windows tests)
    needs: changes
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (!cancelled() && needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.windows_tests == 'true')))
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-windows-tests
          workspaces: rust -> target
          # Pull requests restore main's cache and never save one.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: nextest@0.9.148
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Build the old UI and generate the measured manifest
        env:
          VITE_PRINT_PARTNER_DESKTOP: '1'
          MANIFEST_PYTHON: python3
        run: |
          set -euo pipefail
          node_path=$(node -p process.execPath)
          echo "PP_TEST_NODE=$node_path" >> "$GITHUB_ENV"
          # Install without @print-partner/ui and rust-client, so the manifest
          # script skips the replacement UI build. None of these tests read it.
          npm --prefix web ci --include-workspace-root \
            --workspace @print-partner/contracts --workspace @print-partner/domain \
            --workspace @print-partner/server --workspace @print-partner/web
          npm --prefix web run build
          "$MANIFEST_PYTHON" rust/scripts/build-desktop-manifest.py --web web --node "$node_path" --output rust/bundle-manifest.json --commit "$GITHUB_SHA"
      - name: Run the named Windows tests
        run: |
          set -uo pipefail
          failed=0
          printf '| Ticket | Tests | desktop_rebuild | Result |\n| --- | --- | --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          run_tests() {
            local ticket=$1 features=$2 filter=$3 result=pass
            shift 3
            echo "::group::$ticket $filter ($features)"
            cargo nextest run --manifest-path rust/Cargo.toml --locked --no-fail-fast --no-tests=fail \
              --status-level pass "$@" -E "$filter" || { result=FAIL; failed=1; }
            echo "::endgroup::"
            echo "$ticket $filter desktop_rebuild=$features: $result"
            echo "| $ticket | \`$filter\` | $features | $result |" >> "$GITHUB_STEP_SUMMARY"
          }
          on=(-p pp-compat -p pp-gateway -p pp-server)
          off=(-p pp-compat --no-default-features)
          respawn='package(pp-compat) & test(=ticket_t_2::ticket_t_2_respawn_blocked_during_verification_starts_no_child)'
          junctions='package(pp-compat) & test(=release::tests::junctions_are_recorded_links_and_cannot_escape)'
          run_tests GRE-1795 on "$respawn" "${on[@]}"
          run_tests GRE-1795 on "$junctions" "${on[@]}"
          run_tests GRE-1796 on 'package(pp-gateway) & test(=slice0_mount::slice0_mount_over_limit_body_gets_the_413_over_a_real_socket)' "${on[@]}"
          run_tests GRE-1799 on 'package(pp-server) & kind(bin) & test(/^health::tests::/)' "${on[@]}"
          run_tests GRE-1795 off "$respawn" "${off[@]}"
          run_tests GRE-1795 off "$junctions" "${off[@]}"
          exit "$failed"

  alert-macos-main:
    needs: rust-nightly
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the macOS main failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERT_KIND: rust
        run: python3 scripts/alert-macos-main.py
