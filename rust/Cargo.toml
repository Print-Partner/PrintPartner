[workspace]
members = ["crates/pp-api", "crates/pp-storage", "crates/pp-core", "crates/pp-compat", "crates/pp-gateway", "crates/pp-server", "crates/pp-contracts", "crates/pp-desktop", "crates/pp-domain", "crates/pp-api-types", "crates/pp-net", "crates/pp-drivers", "crates/pp-services", "crates/pp-source", "crates/pp-perf", "crates/pp-testkit", "crates/pp-os"]
default-members = ["crates/pp-api", "crates/pp-storage", "crates/pp-core", "crates/pp-compat", "crates/pp-gateway", "crates/pp-server", "crates/pp-contracts", "crates/pp-domain", "crates/pp-api-types", "crates/pp-net", "crates/pp-drivers", "crates/pp-services", "crates/pp-source", "crates/pp-perf", "crates/pp-testkit", "crates/pp-os"]
exclude = ["fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[workspace.dependencies]
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
anyhow = "=1.0.104"
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.53.3", features = ["full"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
serde_path_to_error = "=0.1.20"
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.17", features = ["tokio"] }
http-body-util = "=0.1.3"
http-body = "=1.0.1"
rand = "=0.9.5"
hmac = "=0.12.1"
sha2 = "=0.10.9"
hex = "=0.4.3"
fs2 = "=0.4.3"
fs4 = "=1.1.0"
libc = "=0.2.189"
tower-http = { version = "=0.6.11", features = ["fs"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
regex = "=1.13.1"
tracing = "=0.1.44"
thiserror = "=2.0.21"

[profile.dev.package.sha2]
opt-level = 3

# Password KDFs run at production cost in auth tests. Unoptimized, one scrypt or
# Argon2 hash takes seconds and auth tests time out on a busy runner (GRE-640).
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
