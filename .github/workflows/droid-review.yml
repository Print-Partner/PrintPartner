name: Droid Auto Review

# SUSPENDED (GRE-1222): the Factory quota is out, so the job below runs only when
# the repository variable PP_DROID_REVIEW is `on`. It is unset, so the job reports
# `skipped`. review-gate treats a skipped droid-review as no Droid review and
# passes on the Claude reviews or the coordinator marker instead. Set the
# variable to `on` when the quota returns; a provider-neutral gate replaces Droid
# otherwise.
#
# When active, Factory Droid reviews every ready PR head. Droid is optional: the
# required check is `review-gate` (review-gate.yml), which accepts a head on which
# this `droid-review` job succeeded, or one of the other review paths.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (vars.PP_DROID_REVIEW == 'on')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: useblacksmith/checkout@v1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Require the Factory API key
        # Without the key droid-action skips and the job would pass, and satisfy review-gate, unreviewed.
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
        run: |
          if [ -z "$FACTORY_API_KEY" ]; then
            echo "::error::FACTORY_API_KEY is not set, so Droid cannot review this PR."
            exit 1
          fi
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@260eac443df653198ed70e9ea9d32980cfabde23 # v13
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          security_block_on_critical: true
          security_block_on_high: true
          allowed_bots: factory-droid
