name: Review gate

# `review-gate` is the required review check. It runs on pull_request_target,
# so GitHub runs this file and its logic from the base branch, never the PR's
# copy. The job reads the GitHub API only (files, check runs, workflow runs and
# comments). It never checks out or runs PR code, and it gets no secrets.
#
# It passes on a PR head when any of these holds for that exact head SHA:
#   1. the droid-review job of .github/workflows/droid-review.yml succeeded;
#   2. the claude-code-review job of .github/workflows/claude-review.yml
#      succeeded and claude-security-review succeeded or was neutral;
#   For 1 and 2 the check suite must come from that workflow path on
#   pull_request, and GitHub must have run the default branch's copy of the
#   file: its blob at the head equals the default branch's blob, or the PR does
#   not change the file (the merge commit then carries the base's copy).
#   3. a comment by the repository owner carries the coordinator marker
#      <!-- pp-review-gate head=<40-char sha> reviewer=<model> findings=<n> -->
# It fails, whatever else holds, when a PR author other than the owner changes
# a workflow, .github/zizmor.yml or scripts/agent-guard.py, or when a check run
# named like one of these jobs comes from any other workflow file or event.
# Every push starts a new run, which fails until one path holds for the new
# head. review-gate-rerun.yml reruns this job when a review workflow finishes
# or a marker comment changes. See docs/development/definition-of-done.md#code-review.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Require a finished review of the head commit
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          import json, os, re, subprocess, sys

          REPO, PR, HEAD = os.environ["REPO"], os.environ["PR_NUMBER"], os.environ["HEAD_SHA"]
          AUTHOR, OWNER, DEFAULT = os.environ["AUTHOR"], os.environ["OWNER"], os.environ["DEFAULT_BRANCH"]
          ACTIONS_APP = 15368
          PROTECTED = re.compile(r"^(?:\.github/workflows/|\.github/zizmor\.yml$|scripts/agent-guard\.py$)")
          # Each job check the gate reads, and the only workflow file and event that may produce it.
          ORIGINS = {
              "review-gate": (".github/workflows/review-gate.yml", "pull_request_target"),
              "droid-review": (".github/workflows/droid-review.yml", "pull_request"),
              "claude-code-review": (".github/workflows/claude-review.yml", "pull_request"),
              "claude-security-review": (".github/workflows/claude-review.yml", "pull_request"),
          }
          MARKER = re.compile(r"<!--[ \t]*pp-review-gate[ \t]+([^>]*?)[ \t]*-->")


          def pages(path):
              out = subprocess.run(["gh", "api", "--paginate", "--slurp", path],
                                   check=True, capture_output=True, text=True).stdout
              return json.loads(out)


          def blob(path, ref):
              result = subprocess.run(["gh", "api", f"repos/{REPO}/contents/{path}?ref={ref}"],
                                      capture_output=True, text=True)
              return json.loads(result.stdout).get("sha") if result.returncode == 0 else None


          files = {item["filename"] for page in pages(f"repos/{REPO}/pulls/{PR}/files?per_page=100") for item in page}
          runs = [run for page in pages(f"repos/{REPO}/commits/{HEAD}/check-runs?filter=all&per_page=100")
                  for run in page["check_runs"] if run["name"] in ORIGINS]
          comments = [item for page in pages(f"repos/{REPO}/issues/{PR}/comments?per_page=100") for item in page]

          suites = {}


          def origin(run):
              """Return (workflow path, event) of the Actions run that produced a check run, or None."""
              if (run.get("app") or {}).get("id") != ACTIONS_APP:
                  return None
              suite = run["check_suite"]["id"]
              if suite not in suites:
                  found = [item for page in pages(f"repos/{REPO}/actions/runs?check_suite_id={suite}")
                           for item in page["workflow_runs"]]
                  suites[suite] = (found[0]["path"].split("@")[0], found[0]["event"]) if found else None
              return suites[suite]


          problems, latest = [], {}
          if AUTHOR != OWNER:
              touched = sorted(name for name in files if PROTECTED.match(name))
              if touched:
                  problems.append(f"{AUTHOR} is not the repository owner and changes {', '.join(touched)}.")
          for run in runs:
              name, where = run["name"], origin(run)
              if where != ORIGINS[name]:
                  problems.append(f"check run {name} ({run['id']}) comes from {where or 'another app'}, "
                                  f"not {ORIGINS[name][0]} on {ORIGINS[name][1]}.")
              elif name not in latest or (run.get("started_at") or "") > (latest[name].get("started_at") or ""):
                  latest[name] = run


          def state(name):
              run = latest.get(name)
              return "missing" if run is None else run.get("conclusion") or run.get("status")


          marker = None
          for comment in comments:
              if (comment.get("user") or {}).get("login") != OWNER:
                  continue
              for fields in MARKER.findall(comment.get("body") or ""):
                  values = dict(re.findall(r"([a-z]+)=([^ \t]+)", fields))
                  if (values.get("head") == HEAD and values.get("reviewer")
                          and re.fullmatch(r"[0-9]+", values.get("findings", ""))):
                      marker = f"{values['reviewer']}, {values['findings']} findings, {comment.get('html_url')}"

          def base_definition(path):
              """Whether GitHub ran the default branch's copy of a workflow file for this head."""
              if path not in files:
                  return True
              head = blob(path, HEAD)
              return head is not None and head == blob(path, DEFAULT)


          droid, code, security = state("droid-review"), state("claude-code-review"), state("claude-security-review")
          droid_ok = droid == "success" and base_definition(ORIGINS["droid-review"][0])
          claude_ok = (code == "success" and security in ("success", "neutral")
                       and base_definition(ORIGINS["claude-code-review"][0]))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"## Review gate for `{HEAD}`\n\n| Path | State |\n| --- | --- |\n"
                            f"| droid-review | {droid} |\n| claude-code-review | {code} |\n"
                            f"| claude-security-review | {security} |\n| coordinator marker | {marker or 'none'} |\n")
              for problem in problems:
                  summary.write(f"\n**Blocked:** {problem}\n")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          if droid_ok:
              print(f"Passed: droid-review succeeded on {HEAD}.")
          elif claude_ok:
              print(f"Passed: claude-code-review succeeded and claude-security-review is {security} on {HEAD}.")
          elif marker:
              print(f"Passed: coordinator marker for {HEAD} ({marker}).")
          else:
              print(f"::error::No finished review of {HEAD}: droid-review is {droid}, claude-code-review is {code}, "
                    f"claude-security-review is {security}, and no coordinator marker names this head. "
                    "A review from a workflow file this PR changes away from the default branch does not count.")
              sys.exit(1)
